<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Hilo Nuestro</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6EFE4">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root { --crema:#F6EFE4; --tinta:#3B2F2A; --terracota:#B5483A; --terracota-h:#9E3D30; --salvia:#8A9A7B; --arena:#EBDFCB; --arena-d:#CDBA9C; --gris:#6F6058; --rosa:#F3C7BD; --abeto:#46594A; --dorado:#D9A94B; --ok:#46594A; --mal:#B5483A; --blanco:#FFFDF9; color-scheme: light; }
@font-face { font-family:"Pagella"; src:url("../fonts/TeXGyrePagella-Regular.woff") format("woff"); font-weight:400; font-display:swap; }
@font-face { font-family:"Pagella"; src:url("../fonts/TeXGyrePagella-Italic.woff") format("woff"); font-weight:400; font-style:italic; font-display:swap; }
@font-face { font-family:"Chorus"; src:url("../fonts/TeXGyreChorus-MediumItalic.woff") format("woff"); font-weight:400; font-style:italic; font-display:swap; }
@font-face { font-family:"Lora"; src:url("../fonts/Lora-Variable.woff") format("woff"); font-weight:400 700; font-display:swap; }
*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--crema); color:var(--tinta); font:400 15px/1.5 "Lora", Georgia, serif; -webkit-font-smoothing:antialiased; }
h1, h2, h3, p, ul { margin:0; } ul { padding:0; list-style:none; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--terracota); outline-offset:2px; }
.wrap { width:min(100%, 1120px); margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }

/* barra superior */
.demo { background:var(--tinta); color:var(--rosa); text-align:center; font-size:.78rem; letter-spacing:.05em; padding:.5rem 1rem; }
.top { position:sticky; top:0; z-index:20; background:var(--crema); border-bottom:1px solid var(--arena-d); padding-top:env(safe-area-inset-top, 0px); }
.top .wrap { display:flex; align-items:center; gap:14px 22px; flex-wrap:wrap; padding-block:10px; }
.top img { width:122px; }
.top .quien { margin-left:auto; font-size:.8rem; color:var(--gris); }
nav { display:flex; gap:4px; flex-wrap:wrap; }
nav button { background:none; border:0; border-bottom:2px solid transparent; padding:.55rem .8rem; cursor:pointer; font-weight:600; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); }
nav button:hover { color:var(--tinta); }
nav button[aria-current="page"] { color:var(--terracota); border-bottom-color:var(--terracota); }
main { padding-block:22px 80px; min-height:60vh; }
h1 { font-family:"Pagella", Palatino, Georgia, serif; font-weight:400; font-size:1.9rem; line-height:1.15; }
h1 em, h2 em { font-family:"Chorus", Georgia, serif; font-style:italic; color:var(--terracota); font-size:1.25em; line-height:0; }
h2 { font-family:"Pagella", Palatino, Georgia, serif; font-weight:400; font-size:1.3rem; margin-bottom:.8rem; }
.fila { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.sub { color:var(--gris); font-size:.9rem; }

/* controles */
.ctl { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
label.c { display:grid; gap:3px; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gris); }
select, input[type=text], input[type=date], input[type=number], input[type=search], textarea { background:var(--blanco); border:1px solid var(--arena-d); border-radius:2px; padding:.55rem .7rem; min-height:40px; font-size:.95rem; letter-spacing:0; text-transform:none; }
textarea { width:100%; min-height:70px; resize:vertical; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; background:var(--terracota); color:var(--crema); border:0; border-radius:2px; padding:.6rem 1rem; min-height:40px; font-weight:600; font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; text-decoration:none; transition:background .15s, translate .15s; }
.btn:hover { background:var(--terracota-h); translate:0 -1px; }
.btn:disabled { opacity:.55; cursor:default; translate:0 0; }
.btn.linea { background:transparent; color:var(--terracota); box-shadow:inset 0 0 0 1.5px var(--terracota); }
.btn.linea:hover { background:var(--terracota); color:var(--crema); }
.btn.chico { min-height:34px; padding:.4rem .75rem; }
.btn.peligro { background:#8a2f24; }

/* tarjetas */
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:18px; }
.card { background:var(--blanco); border:1px solid var(--arena-d); border-radius:3px; padding:16px 18px; }
.card .t { font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gris); }
.card .n { font-family:"Pagella", Palatino, Georgia, serif; font-size:1.9rem; line-height:1.15; margin-top:4px; }
.card .p { font-size:.82rem; color:var(--gris); margin-top:2px; }
.card.dest { background:var(--arena); }
.pos { color:var(--ok); } .neg { color:var(--mal); }
.alertas { display:grid; gap:8px; margin-bottom:18px; }
.alerta { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:#fff4ee; border:1px solid var(--terracota); border-left-width:5px; border-radius:3px; padding:10px 14px; font-size:.92rem; }
.alerta.suave { background:var(--blanco); border-color:var(--arena-d); border-left-color:var(--dorado); }
.panel { background:var(--blanco); border:1px solid var(--arena-d); border-radius:3px; padding:18px; margin-bottom:18px; }
.barra { height:10px; background:var(--arena); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
.barra i { display:block; height:100%; background:var(--terracota); border-radius:99px; transition:width .6s ease; }
.barra.lleno i { background:var(--ok); }
svg.grafico { width:100%; height:auto; display:block; }
svg.grafico text { font:11px "Lora", Georgia, serif; fill:var(--gris); }
svg.grafico .barra-d { fill:var(--terracota); transition:opacity .15s; } svg.grafico .barra-d:hover { opacity:.75; }

/* tabla */
.tabla { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.9rem; }
th { text-align:left; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gris); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--arena-d); white-space:nowrap; }
td { padding:10px; border-bottom:1px solid var(--arena); vertical-align:middle; }
tbody tr[data-id] { cursor:pointer; } tbody tr[data-id]:hover { background:#fbf5ea; }
td.mail { max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
.b { display:inline-block; padding:2px 9px; border-radius:99px; font-size:.74rem; font-weight:600; white-space:nowrap; background:var(--arena); color:var(--tinta); }
.b-delivered { background:#dfe8d8; color:#2f4a36; } .b-approved, .b-delivering { background:#e6efd9; color:#46594A; }
.b-delivery_failed, .b-revisar { background:#f7d6cf; color:#8a2f24; } .b-rejected, .b-cancelled { background:#f3e3df; color:#8a5a50; }
.b-refunded { background:#e6e0d8; color:var(--gris); } .b-pending { background:var(--arena); }
.pag { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; font-size:.88rem; color:var(--gris); }
.vacio { text-align:center; color:var(--gris); padding:36px 10px; }

/* modal y avisos */
#modal { position:fixed; inset:0; z-index:50; background:rgba(59,47,42,.5); display:grid; place-items:center; padding:16px; overflow:auto; }
#modal[hidden] { display:none; }
.hoja { background:var(--crema); border-radius:4px; width:min(100%, 640px); max-height:calc(100vh - 32px); overflow:auto; padding:22px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); }
.hoja .cab { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:14px; }
.dl { display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:.9rem; margin-bottom:16px; }
.dl dt { color:var(--gris); } .dl dd { margin:0; word-break:break-word; }
.ev { font-size:.84rem; border-top:1px solid var(--arena-d); }
.ev li { display:grid; grid-template-columns:96px 1fr; gap:10px; padding:6px 0; border-bottom:1px dotted var(--arena-d); }
.ev time { color:var(--gris); }
.acc { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
#toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); translate:-50% 0; background:var(--tinta); color:var(--crema); padding:10px 16px; border-radius:3px; font-size:.9rem; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s; max-width:90vw; text-align:center; }
#toast.on { opacity:1; }
.ajuste { display:grid; grid-template-columns:24px 1fr; gap:10px; padding:10px 0; border-bottom:1px dotted var(--arena-d); }
.ajuste .ic { font-weight:700; } .ajuste .si { color:var(--ok); } .ajuste .no { color:var(--mal); }
code, .mono { font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:.82rem; background:var(--arena); padding:1px 6px; border-radius:2px; word-break:break-all; }
.bloqueo { max-width:520px; margin:70px auto; text-align:center; }

/* en celular, la tabla se vuelve una lista de tarjetas */
@media (max-width: 760px) {
  thead { display:none; }
  table, tbody, tr, td { display:block; width:100%; }
  tbody tr { border:1px solid var(--arena-d); border-radius:3px; margin-bottom:10px; padding:6px 10px; background:var(--blanco); }
  td { border:0; padding:4px 0; display:flex; justify-content:space-between; gap:12px; text-align:right; }
  td::before { content:attr(data-l); color:var(--gris); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; text-align:left; flex:none; }
  td.mail { max-width:none; white-space:normal; word-break:break-all; }
  .dl { grid-template-columns:1fr; } .dl dt { margin-top:6px; }
  h1 { font-size:1.6rem; }
}
@media (prefers-reduced-motion: reduce) { .btn, .barra i, #toast { transition:none; } }
</style>
</head>
<body>
<div class="demo" id="demo" hidden>MODO DEMO · todos los datos son de ejemplo, no hay ventas reales</div>
<header class="top">
  <div class="wrap">
    <img src="../brand/hilo-nuestro_color.svg" width="233" height="44" alt="Hilo Nuestro">
    <nav id="nav" aria-label="Secciones">
      <button data-v="resumen">Resumen</button><button data-v="ventas">Ventas</button><button data-v="gastos">Gastos</button><button data-v="ajustes">Ajustes</button>
    </nav>
    <span class="quien" id="quien"></span>
  </div>
</header>
<main class="wrap" id="vista" aria-live="polite"></main>
<div id="modal" hidden><div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t"></div></div>
<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  var DEMO = location.protocol === "file:" || /[?&]demo(=|&|$)/.test(location.search) || !!window.__PREVIEW__;
  var TZ = "America/Argentina/Buenos_Aires";
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return "$" + Math.round(n || 0).toLocaleString("es-AR"); };
  var fFecha = function (iso) { return iso ? new Date(iso).toLocaleString("es-AR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }) : "—"; };
  var diaAR = function (t) { return new Date(new Date(t).getTime() - 3 * 3600e3).toISOString().slice(0, 10); };
  var hoyAR = function () { return diaAR(Date.now()); };
  var ESTADOS = { pending: "Pendiente", approved: "Aprobada", delivering: "Enviando", delivered: "Entregada", delivery_failed: "Falló el mail", rejected: "Rechazada", cancelled: "Cancelada", refunded: "Reembolsada", revisar: "Revisar" };
  var badge = function (s) { return '<span class="b b-' + esc(s) + '">' + esc(ESTADOS[s] || s) + "</span>"; };
  var MP_EST = { approved: "aprobado", pending: "pendiente", in_process: "en proceso", rejected: "rechazado", refunded: "reembolsado", cancelled: "cancelado", charged_back: "contracargo" };
  var CATS = { publicidad: "Publicidad", dominio: "Dominio", software: "Software", impuestos: "Impuestos", otros: "Otros" };

  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove("on"); }, 3200); }
  function bloqueo(msg) {
    $("#vista").innerHTML = '<div class="bloqueo"><h1>Sin <em>acceso</em></h1><p class="sub" style="margin-top:12px">' + esc(msg) + '</p><p class="sub" style="margin-top:12px">Este panel solo abre desde tu cuenta de Cloudflare Access. Si es un error, revisá la sección Panel del README.</p></div>';
  }

  /* ---------------- acceso a datos ---------------- */
  function api(path, opt) {
    opt = opt || {};
    if (DEMO) return demoApi(path, opt);
    var init = { method: opt.method || "GET", headers: { "x-hilo-admin": "1" }, credentials: "same-origin" };
    if (opt.body !== undefined) { init.body = JSON.stringify(opt.body); init.headers["content-type"] = "application/json"; }
    return fetch("/api/admin/" + path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 || r.status === 503 || (r.status === 403 && j.error && /mail/i.test(j.error))) { bloqueo(j.error || "Sin acceso."); throw new Error("auth"); }
        if (!r.ok) { var e = new Error(j.error || "Error " + r.status); e.data = j; throw e; }
        return j;
      });
    });
  }
  var cfgCache = null;
  function cfg() { return cfgCache ? Promise.resolve(cfgCache) : api("config").then(function (c) { cfgCache = c; return c; }); }

  /* ---------------- vistas ---------------- */
  var vistas = { resumen: vResumen, ventas: vVentas, gastos: vGastos, ajustes: vAjustes };
  function ir() {
    var v = (location.hash || "#resumen").slice(1);
    if (!vistas[v]) v = "resumen";
    [].forEach.call(document.querySelectorAll("#nav button"), function (b) { b.removeAttribute("aria-current"); if (b.dataset.v === v) b.setAttribute("aria-current", "page"); });
    $("#vista").innerHTML = '<p class="vacio">Cargando…</p>';
    vistas[v]().catch(function (e) { if (e.message !== "auth") $("#vista").innerHTML = '<p class="vacio">No se pudo cargar: ' + esc(e.message) + "</p>"; });
  }

  function vResumen() {
    var dias = vResumen.dias || "30";
    return Promise.all([api("resumen?dias=" + dias), cfg()]).then(function (r) {
      var d = r[0], c = r[1], k = d.kpis, a = d.atencion;
      var netoVenta = Math.round(c.precio * (1 - (k.comision_pct / 100) * 1.21));
      var necesarias = netoVenta > 0 && k.gastos > 0 ? Math.ceil(k.gastos / netoVenta) : 0;
      var prog = necesarias ? Math.min(100, Math.round((k.ventas / necesarias) * 100)) : 0;
      var alertas = "";
      if (a.fallidos) alertas += '<div class="alerta"><span><b>' + a.fallidos + "</b> " + (a.fallidos === 1 ? "venta pagada sin mail entregado" : "ventas pagadas sin mail entregado") + ' · hay que reenviar los libros.</span><button class="btn chico" data-ir="delivery_failed">Ver</button></div>';
      if (a.revisar) alertas += '<div class="alerta"><span><b>' + a.revisar + "</b> " + (a.revisar === 1 ? "pago" : "pagos") + ' con monto distinto al precio. No se entregó nada: revisalo en Mercado Pago.</span><button class="btn chico" data-ir="revisar">Ver</button></div>';
      if (a.por_acreditar) alertas += '<div class="alerta suave"><span><b>' + a.por_acreditar + "</b> " + (a.por_acreditar === 1 ? "pago pendiente" : "pagos pendientes") + " de acreditación (efectivo o transferencia). Los libros salen solos cuando se acrediten.</span></div>";
      $("#vista").innerHTML =
        '<div class="fila"><div><h1>Resumen <em>del negocio</em></h1><p class="sub">Ventas confirmadas, ' + (d.periodo.dias === "all" ? "de siempre" : "últimos " + d.periodo.dias + " días") + ". Horario de Argentina.</p></div>" +
        '<label class="c">Período<select id="rango">' + [["7", "7 días"], ["30", "30 días"], ["90", "90 días"], ["all", "Todo"]].map(function (o) { return '<option value="' + o[0] + '"' + (String(dias) === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></label></div>" +
        (alertas ? '<div class="alertas">' + alertas + "</div>" : "") +
        '<div class="grid">' +
        tarjeta("Hoy", d.hoy.ventas + (d.hoy.ventas === 1 ? " venta" : " ventas"), money(d.hoy.bruto), true) +
        tarjeta("Ventas", k.ventas, "Ticket promedio " + money(k.ticket)) +
        tarjeta("Ingresos brutos", money(k.bruto), "Lo que pagaron las compradoras") +
        tarjeta("Neto estimado", money(k.neto_est), "Después de comisión de MP (" + k.comision_pct + "% + IVA) ≈ " + money(k.comision_est)) +
        tarjeta("Gastos", money(k.gastos), k.gastos ? "Cargados en la pestaña Gastos" : "Todavía no cargaste gastos") +
        '<div class="card dest"><div class="t">Resultado</div><div class="n ' + (k.resultado >= 0 ? "pos" : "neg") + '">' + money(k.resultado) + '</div><div class="p">Neto estimado − gastos</div></div>' +
        (k.cac != null ? tarjeta("Costo por venta (publicidad)", money(k.cac), "Retorno publicitario: " + String(k.roas).replace(".", ",") + "×") : "") +
        (k.reembolsos ? tarjeta("Reembolsos", k.reembolsos, money(k.reembolsado)) : "") +
        "</div>" +
        (necesarias ? '<div class="panel"><h2>Punto de <em>equilibrio</em></h2><p>Para cubrir los gastos de este período necesitás <b>' + necesarias + ' ventas</b> (te quedan ≈ ' + money(netoVenta) + ' netos por venta). Llevás <b>' + k.ventas + "</b>.</p>" +
          '<div class="barra' + (prog >= 100 ? " lleno" : "") + '"><i style="width:' + prog + '%"></i></div><p class="sub">' + (k.ventas >= necesarias ? "¡Ya cubriste los gastos del período! 🎉" : "Faltan " + (necesarias - k.ventas) + " ventas.") + "</p></div>" : "") +
        '<div class="panel"><h2>Ingresos por <em>día</em></h2>' + grafico(d) + "</div>";
      $("#rango").onchange = function (e) { vResumen.dias = e.target.value; ir(); };
      [].forEach.call(document.querySelectorAll("[data-ir]"), function (b) { b.onclick = function () { vVentas.f = { estado: b.dataset.ir }; location.hash = "#ventas"; }; });
    });
  }
  function tarjeta(t, n, p, dest) { return '<div class="card' + (dest ? " dest" : "") + '"><div class="t">' + esc(t) + '</div><div class="n">' + esc(n) + '</div><div class="p">' + esc(p) + "</div></div>"; }
  function grafico(d) {
    var mapa = {}; d.serie.forEach(function (s) { mapa[s.dia] = s; });
    var fin = d.periodo.hasta, ini = d.periodo.desde || (d.serie[0] && d.serie[0].dia) || fin, dias = [];
    for (var t = new Date(ini + "T12:00:00Z"); t.toISOString().slice(0, 10) <= fin && dias.length < 400; t = new Date(t.getTime() + 86400e3)) dias.push(t.toISOString().slice(0, 10));
    var max = Math.max.apply(null, dias.map(function (x) { return mapa[x] ? mapa[x].bruto : 0; }).concat([1]));
    var W = 720, H = 210, ml = 8, mb = 22, mt = 14, bw = (W - ml * 2) / dias.length, bars = "", labels = "";
    dias.forEach(function (x, i) {
      var s = mapa[x], h = s ? Math.max(2, (s.bruto / max) * (H - mb - mt)) : 0, xx = ml + i * bw;
      if (s) bars += '<rect class="barra-d" x="' + (xx + bw * 0.12).toFixed(1) + '" y="' + (H - mb - h).toFixed(1) + '" width="' + Math.max(1, bw * 0.76).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1.5"><title>' + x.slice(8) + "/" + x.slice(5, 7) + ": " + s.ventas + (s.ventas === 1 ? " venta · " : " ventas · ") + money(s.bruto) + "</title></rect>";
      if (i % Math.ceil(dias.length / 8) === 0) labels += '<text x="' + (xx + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + x.slice(8) + "/" + x.slice(5, 7) + "</text>";
    });
    if (!d.serie.length) return '<p class="vacio">Todavía no hay ventas en este período.</p>';
    return '<svg class="grafico" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Ingresos por día"><line x1="' + ml + '" x2="' + (W - ml) + '" y1="' + (H - mb) + '" y2="' + (H - mb) + '" stroke="#CDBA9C"/><text x="' + ml + '" y="10">' + money(max) + "</text>" + bars + labels + "</svg>";
  }

  /* ----- ventas ----- */
  function vVentas() {
    var f = vVentas.f = vVentas.f || {};
    f.pagina = f.pagina || 1;
    var qs = ["limite=20", "pagina=" + f.pagina];
    ["estado", "q", "desde", "hasta"].forEach(function (k) { if (f[k]) qs.push(k + "=" + encodeURIComponent(f[k])); });
    return api("ventas?" + qs.join("&")).then(function (d) {
      var desde = (f.pagina - 1) * d.limite + 1, hasta = Math.min(d.total, f.pagina * d.limite);
